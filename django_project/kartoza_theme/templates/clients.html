{% load mezzanine_tags %}
{% load %}

<div class="row">
    <div class="col-xs-8 col-xs-offset-2">
        <div class="home-page-heading text-center">
            Our Clients
        </div>
        <div class="home-page-clients-carousel">
            {% for client in clients %}
                <div class="col-xs-3">
                    <img src="{{ MEDIA_URL }}{% thumbnail client.logo 200 200 %}"
                         alt="{{ client.name }}"/></div>
            {% endfor %}
        </div>
    </div>
</div>
