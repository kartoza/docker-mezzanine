<div class="modal fade" id="export_modal">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal"
				        aria-hidden="true">&times;
				</button>
				<h4 class="modal-title">Modal title</h4>
			</div>
			<div class="modal-body">
				<div class="row">
					<div class="col-sm-12">
						Projects to export: <span id="project_ids"></span>
					</div>
				</div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-default"
				        data-dismiss="modal">Close
				</button>
				<button type="button" data-action="export" class="btn btn-primary">Export</button>
			</div>
		</div><!-- /.modal-content -->
	</div><!-- /.modal-dialog -->
	<input type="hidden" id='export-projects' value="{% url 'export_projects' %}">
</div><!-- /.modal -->
